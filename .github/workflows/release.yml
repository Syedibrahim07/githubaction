name: python code build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: python files
        run: |
          cat << 'EOF' >main.py
          name : "Vijaykarthi"
          age : "22"
          print("Hello",name,age)
          EOF
          python main.py
