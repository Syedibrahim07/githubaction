name: Run Python

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python file
        run: |
          cat > app.py <<EOF
          name = "Arun"
          age  = "22"
          print("Hello", name , age)
          EOF

      - name: Run Python file
        run: python app.py

